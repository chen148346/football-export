<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据导出 - 足球比赛数据文档分析系统 V2.6.3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; background: #f0f2f5; color: #333; font-size: 14px; }
        .header { background: linear-gradient(135deg, #1a5276 0%, #2e86c1 100%); color: white; padding: 18px 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .header h1 { font-size: 22px; margin-bottom: 4px; }
        .header .subtitle { font-size: 13px; opacity: 0.85; }
        .nav-tabs { background: white; padding: 0 30px; display: flex; gap: 5px; border-bottom: 2px solid #e0e0e0; }
        .nav-tab { padding: 12px 24px; cursor: pointer; border: none; background: none; font-size: 14px; color: #666; border-bottom: 3px solid transparent; text-decoration: none; transition: all 0.2s; }
        .nav-tab:hover { color: #2e86c1; }
        .nav-tab.active { color: #2e86c1; border-bottom-color: #2e86c1; font-weight: 600; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .section { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .section h2 { font-size: 16px; color: #1a5276; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #e8e8e8; }
        .form-row { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 200px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .form-group .hint { font-size: 12px; color: #999; margin-top: 4px; }
        .radio-group, .checkbox-group { display: flex; gap: 15px; flex-wrap: wrap; }
        .radio-item, .checkbox-item { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; }
        .radio-item:hover, .checkbox-item:hover { background: #f0f7ff; }
        .radio-item input, .checkbox-item input { margin: 0; }
        .btn { padding: 10px 24px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s; }
        .btn-primary { background: #2e86c1; color: white; }
        .btn-primary:hover { background: #1a5276; }
        .btn-primary:disabled { background: #aaa; cursor: not-allowed; }
        .progress-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .progress-modal.active { display: flex; }
        .progress-box { background: white; padding: 30px; border-radius: 8px; width: 400px; text-align: center; }
        .progress-bar-bg { width: 100%; height: 20px; background: #e0e0e0; border-radius: 10px; overflow: hidden; margin: 15px 0; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #2e86c1, #3498db); transition: width 0.3s; }
        .result-box { display: none; background: #d4edda; border: 1px solid #c3e6cb; border-radius: 4px; padding: 15px; margin-top: 15px; }
        .result-box.show { display: block; }
        .result-box a { color: #2e86c1; text-decoration: none; }
        .result-box a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚽ 足球比赛数据文档分析系统 V2.6.3</h1>
        <div class="subtitle">数据导出 · 训练模式/预测模式 · Excel 7个Sheet结构化导出</div>
        <div style="margin-top: 10px;">
            <a href="/" class="nav-tab" style="color: white; text-decoration: none; font-size: 13px; opacity: 0.9; margin-right: 20px; border: 1px solid rgba(255,255,255,0.3); padding: 4px 12px; border-radius: 4px;">🏠 首页</a>
            <a href="/export" class="nav-tab active" style="color: white; text-decoration: none; font-size: 13px; opacity: 0.9; border: 1px solid rgba(255,255,255,0.3); padding: 4px 12px; border-radius: 4px;">📊 数据导出</a>
        </div>
    </div>

    <div class="container">
        <div class="section">
            <h2>筛选条件</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>日期范围（开始）</label>
                    <input type="date" id="dateStart">
                    <div class="hint">训练模式默认近30天</div>
                </div>
                <div class="form-group">
                    <label>日期范围（结束）</label>
                    <input type="date" id="dateEnd">
                    <div class="hint">默认今天</div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex: 1 1 100%;">
                    <label>联赛类型（可多选） <span id="sclassCount" style="color: #2e86c1; font-weight: 600;">已选择 0 个联赛（不选则导出全部）</span></label>
                    <div style="display: flex; gap: 10px; margin-top: 8px;">
                        <div style="flex: 1; border: 1px solid #ddd; border-radius: 4px; padding: 8px; min-height: 150px; max-height: 200px; overflow-y: auto; background: #f8f9fa;">
                            <div style="font-size: 12px; color: #888; margin-bottom: 6px; font-weight: 600;">已选联赛（点击移除）</div>
                            <div id="selectedSclassList"></div>
                        </div>
                        <div style="flex: 1.5; border: 1px solid #ddd; border-radius: 4px; padding: 8px;">
                            <input type="text" id="sclassSearch" placeholder="🔍 搜索联赛..." style="width: 100%; padding: 4px 8px; margin-bottom: 6px; border: 1px solid #ccc; border-radius: 3px;">
                            <div style="display: flex; gap: 6px; margin-bottom: 6px;">
                                <button type="button" onclick="selectAllVisibleSclass()" style="padding: 3px 10px; font-size: 12px; background: #27ae60; color: white; border: none; border-radius: 3px; cursor: pointer;">全选可见</button>
                                <button type="button" onclick="clearAllSclass()" style="padding: 3px 10px; font-size: 12px; background: #e74c3c; color: white; border: none; border-radius: 3px; cursor: pointer;">清空选择</button>
                            </div>
                            <div id="sclassOptions" style="max-height: 130px; overflow-y: auto; border: 1px solid #eee; border-radius: 3px;">
                                {% for s in sclass_list %}
                                <div class="sclass-option" data-name="{{ s }}" onclick="toggleSclass('{{ s }}')" style="padding: 4px 8px; cursor: pointer; border-bottom: 1px solid #f0f0f0; font-size: 13px;">
                                    <span class="sclass-check" style="display: inline-block; width: 14px;">☐</span> {{ s }}
                                </div>
                                {% endfor %}
                            </div>
                        </div>
                    </div>
                    <input type="hidden" id="sclassSelectData" name="sclass_names" value="">
                </div>
                <div class="form-group">
                    <label>球队名称（模糊搜索）</label>
                    <input type="text" id="teamSearch" name="team_keyword" placeholder="如：曼联">
                    <div class="hint">筛选主队或客队包含该词的比赛</div>
                </div>
            </div>
            <div class="form-row" id="stateRow">
                <div class="form-group">
                    <label>比赛状态</label>
                    <div class="checkbox-group" id="stateGroup">
                        <label class="checkbox-item"><input type="checkbox" name="state" value="-1" checked disabled> 完场（训练模式锁定）</label>
                    </div>
                </div>
            </div>
            <div class="form-row" id="matchIdsRow" style="display: none;">
                <div class="form-group">
                    <label>比赛ID列表（预测模式专用）</label>
                    <input type="text" id="matchIds" placeholder="如：3018741,3018777,3020545">
                    <div class="hint">多个ID用逗号分隔，留空则自动匹配±10小时窗口内完场比赛</div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>导出设置</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>导出模式</label>
                    <div class="radio-group">
                        <label class="radio-item"><input type="radio" name="mode" value="training" checked onchange="onModeChange()"> 训练模式（批量完场）</label>
                        <label class="radio-item"><input type="radio" name="mode" value="prediction" onchange="onModeChange()"> 预测模式（指定比赛）</label>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>导出格式</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item"><input type="checkbox" id="exportExcel" checked> Excel 结构化数据（7个Sheet）</label>
                        <label class="checkbox-item"><input type="checkbox" id="exportPdf"> PDF 报告（批量生成）</label>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>高级选项</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item"><input type="checkbox" id="includeDict" checked> 附带数据字典（data_dictionary.xlsx）</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>操作与进度</h2>
            <button class="btn btn-primary" id="exportBtn" onclick="startExport()">开始导出</button>
            <div class="result-box" id="resultBox"></div>
        </div>
    </div>

    <div class="progress-modal" id="progressModal">
        <div class="progress-box">
            <h3 id="progressTitle">正在导出...</h3>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
            </div>
            <div id="progressDetail" style="font-size: 13px; color: #666;"></div>
        </div>
    </div>

    <script>
        function onModeChange() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            const stateRow = document.getElementById('stateRow');
            const matchIdsRow = document.getElementById('matchIdsRow');
            if (mode === 'training') {
                stateRow.style.display = 'flex';
                matchIdsRow.style.display = 'none';
            } else {
                stateRow.style.display = 'none';
                matchIdsRow.style.display = 'flex';
            }
        }

        function showProgress(title, percent, detail) {
            document.getElementById('progressTitle').textContent = title;
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressDetail').innerHTML = detail || '';
            document.getElementById('progressModal').classList.add('active');
        }

        function hideProgress() {
            setTimeout(() => {
                document.getElementById('progressModal').classList.remove('active');
                document.getElementById('progressDetail').innerHTML = '';
            }, 800);
        }

        // V2.4.9: 联赛选择交互优化
        let selectedSclass = new Set();

        function toggleSclass(name) {
            if (selectedSclass.has(name)) {
                selectedSclass.delete(name);
            } else {
                selectedSclass.add(name);
            }
            updateSclassUI();
        }

        function updateSclassUI() {
            const listEl = document.getElementById('selectedSclassList');
            if (selectedSclass.size === 0) {
                listEl.innerHTML = '<div style="color: #aaa; font-size: 12px; padding: 4px;">未选择任何联赛（将导出全部）</div>';
            } else {
                listEl.innerHTML = Array.from(selectedSclass).map(name =>
                    `<div onclick="toggleSclass('${name.replace(/'/g, "\\'")}')" style="padding: 4px 8px; background: #d4edda; border: 1px solid #c3e6cb; border-radius: 3px; margin-bottom: 4px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between;">
                        <span>${name}</span><span style="color: #e74c3c;">✕</span>
                    </div>`
                ).join('');
            }
            document.getElementById('sclassCount').textContent =
                selectedSclass.size === 0 ? '已选择 0 个联赛（不选则导出全部）' : `已选择 ${selectedSclass.size} 个联赛`;
            document.querySelectorAll('.sclass-option').forEach(el => {
                const name = el.dataset.name;
                const check = el.querySelector('.sclass-check');
                if (selectedSclass.has(name)) {
                    check.textContent = '☑';
                    el.style.background = '#d4edda';
                } else {
                    check.textContent = '☐';
                    el.style.background = '';
                }
            });
            document.getElementById('sclassSelectData').value = JSON.stringify(Array.from(selectedSclass));
        }

        function selectAllVisibleSclass() {
            document.querySelectorAll('.sclass-option').forEach(el => {
                if (el.style.display !== 'none') {
                    selectedSclass.add(el.dataset.name);
                }
            });
            updateSclassUI();
        }

        function clearAllSclass() {
            selectedSclass.clear();
            updateSclassUI();
        }

        document.getElementById('sclassSearch').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase();
            document.querySelectorAll('.sclass-option').forEach(el => {
                const name = el.dataset.name.toLowerCase();
                el.style.display = name.includes(keyword) ? '' : 'none';
            });
        });

        updateSclassUI();

        function startExport() {
            const btn = document.getElementById('exportBtn');
            btn.disabled = true;
            btn.textContent = '导出中...';
            document.getElementById('resultBox').classList.remove('show');

            const mode = document.querySelector('input[name="mode"]:checked').value;
            const dateStart = document.getElementById('dateStart').value;
            const dateEnd = document.getElementById('dateEnd').value;
            const sclassNames = JSON.parse(document.getElementById('sclassSelectData').value || '[]');
            const teamSearch = document.getElementById('teamSearch').value.trim();
            const matchIds = document.getElementById('matchIds').value.trim();
            const exportExcel = document.getElementById('exportExcel').checked;
            const exportPdf = document.getElementById('exportPdf').checked;
            const includeDict = document.getElementById('includeDict').checked;

            if (!exportExcel && !exportPdf) {
                alert('请至少选择一种导出格式');
                btn.disabled = false;
                btn.textContent = '开始导出';
                return;
            }

            showProgress('正在导出...', 10, '开始处理...');

            const formData = new FormData();
            formData.append('mode', mode);
            formData.append('date_start', dateStart);
            formData.append('date_end', dateEnd);
            formData.append('sclass_names', JSON.stringify(sclassNames));
            formData.append('team_keyword', teamSearch);
            formData.append('match_ids', matchIds);
            formData.append('export_excel', exportExcel ? '1' : '0');
            formData.append('export_pdf', exportPdf ? '1' : '0');
            formData.append('include_dictionary', includeDict ? 'on' : '');

            showProgress('正在导出...', 30, '请求已发送...');

            fetch('/api/export_excel', { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => {
                    hideProgress();
                    if (data.success) {
                        const resultBox = document.getElementById('resultBox');
                        let html = `<strong>✅ 导出成功！</strong><br>模式：${data.mode === 'training' ? '训练模式' : '预测模式'}<br>比赛数量：${data.count} 场`;
                        if (data.excel_path) {
                            html += `<br>📊 Excel文件：<a href="/download_export?file=${encodeURIComponent(data.excel_filename)}" download>${data.excel_filename}</a>`;
                        }
                        if (data.dict_path) {
                            html += `<br>📖 数据字典：<a href="/download_export?file=${encodeURIComponent(data.dict_filename)}" download>${data.dict_filename}</a>`;
                        }
                        resultBox.innerHTML = html;
                        resultBox.classList.add('show');
                    } else {
                        alert('导出失败: ' + data.error);
                    }
                })
                .catch(e => {
                    hideProgress();
                    alert('请求失败: ' + e);
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.textContent = '开始导出';
                });
        }

        (function() {
            const today = new Date();
            const thirtyDaysAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
            document.getElementById('dateStart').value = thirtyDaysAgo.toISOString().split('T')[0];
            document.getElementById('dateEnd').value = today.toISOString().split('T')[0];
        })();
    </script>
</body>
</html>
